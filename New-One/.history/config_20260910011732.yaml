rtsp:
  url: "rtsp://username:password@192.168.1.100:554/stream1"
  reconnect_delay_sec: 5
  frame_skip: 3 # process every Nth frame for performance
  max_read_failures: 15 # skip corrupt h264 frames before reconnecting

camera:
  id: "camera_6"
  name: "Warehouse Camera 6"

# Optional multi-camera list for dashboard live preview selection.
# If omitted, the rtsp.url and camera.id above are used as a single camera.
cameras:
  - id: "camera_1"
    name: "CCTV Camera 1"
    rtsp_url: "rtsp://username:password@192.168.1.100:554/stream1"
    role: "monitor"
  - id: "camera_2"
    name: "CCTV Camera 2"
    rtsp_url: "rtsp://username:password@192.168.1.103:554/stream1"
    role: "monitor"
  - id: "camera_3"
    name: "CCTV Camera 3"
    rtsp_url: "rtsp://username:password@192.168.1.104:554/stream1"
    role: "monitor"
  - id: "camera_4"
    name: "CCTV Camera 4"
    rtsp_url: "rtsp://username:password@192.168.1.105:554/stream1"
    role: "monitor"
  - id: "camera_6"
    name: "Warehouse Camera 6"
    rtsp_url: "rtsp://username:password@192.168.1.100:554/stream1"
    role: "monitor"
  - id: "gate_front"
    name: "Front Gate Camera"
    rtsp_url: "rtsp://username:password@192.168.1.101:554/stream1"
    role: "gate_in"
    gate_id: "main_gate"
    gate_name: "Front Gate"
  - id: "gate_back"
    name: "Back Gate Camera"
    rtsp_url: "rtsp://username:password@192.168.1.102:554/stream1"
    role: "gate_out"
    gate_id: "main_gate"
    gate_name: "Back Gate"

detection:
  # mode: "coco" = standard 80 COCO classes | "world" = custom open-vocabulary classes
  mode: "world"
  model: "yolov8s-worldv2.pt"
  confidence: 0.25
  iou: 0.5
  imgsz: 1280
  # Pathway-only tiled inference for low/wide/floor objects. Does not lower
  # the global confidence; tiles reuse the pathway-block confidence.
  small_object:
    enabled: true
    tile_size: 640
    tile_overlap: 0.25
    imgsz: 640
    max_tiles: 12
    min_height_px: 6
    wide_aspect: 2.2
  # Excluded from pathway blocking — people, worn PPE, phones, fire/smoke.
  # Only stationary objects in the pathway zone are flagged as blockages.
  blocking_exclude_classes:
    - person
    - helmet
    - hard hat
    - safety helmet
    - safety vest
    - high visibility vest
    - reflective vest
    - gloves
    - safety gloves
    - work gloves
    - boots
    - safety boots
    - safety shoes
    - cell phone
    - mobile phone
    - smartphone
    - phone
  custom_classes:
    - person
    - cell phone
